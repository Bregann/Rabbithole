# Runs on every pull request (including Renovate's) and on pushes to main.
# Renovate only auto-merges an update once every job here passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: .NET API (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - run: dotnet restore Rabbithole.sln
      - name: Check formatting
        run: dotnet format Rabbithole.sln --verify-no-changes --no-restore
      - run: dotnet build Rabbithole.sln --no-restore -c Release
      - name: Run tests (Testcontainers uses the runner's Docker)
        run: dotnet test Rabbithole.sln --no-build -c Release

  web:
    name: React SPA (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rabbithole.web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: rabbithole.web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build

  image:
    name: Single Docker image builds
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t rabbithole:ci .
